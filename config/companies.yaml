# Watch list configuration.
#
# Only stable properties live here (URLs, toggles, candidate endpoints).
# Complex, company specific rules live in the corresponding Python adapter.
#
# IMPORTANT - candidate_endpoints:
#   These lists are intentionally EMPTY. The project never fabricates an API
#   URL. When you confirm a real backend endpoint by inspecting the page's
#   XHR/fetch traffic in your browser devtools, paste it here; the adapter will
#   probe it, validate the response shape and only then use it. If the probe
#   fails for any reason, the adapter transparently falls back to the
#   documented fallback for that company, so the monitor never breaks.

companies:

  bluefit:
    name: Bluefit
    monitor: bluefit
    enabled: true
    primary_url: https://ri.bluefit.com.br/informacoes-financeiras/central-de-resultados/
    # MZ platform. Confirmed: the page is rendered client-side (plain HTTP
    # returns "Nenhum arquivo para o ano selecionado"), so the fallback is
    # Playwright until a backend endpoint is confirmed.
    #
    # As of 2026-09-20, ri.bluefit.com.br's own TLS certificate is expired
    # (confirmed via both plain HTTP and Playwright - see the ERR_CERT_DATE
    # handling in monitors/bluefit.py). Certificate verification is
    # deliberately never disabled to work around this.
    #
    # The api.mziq.com lead (MZ's shared platform domain, under company id
    # d83ecf03-07f6-4822-8e26-922775bc0a72) was investigated and does NOT
    # pan out: MZ's file manager has no listing/directory API (its
    # /mzfilemanager/v2/d/{company-uuid} endpoint returns 401), so document
    # UUIDs can only be harvested from the IR page's own HTML - which means
    # still loading ri.bluefit.com.br first, the exact step blocked by the
    # expired certificate. There is no alternate MZ-hosted source that
    # sidesteps this. Left disabled pending either the certificate being
    # renewed or a different (non-MZ) official source being found.
    candidate_endpoints: []
    pdf_fallback: true

  selfit:
    name: Selfit
    monitor: selfit
    enabled: true
    primary_url: https://www.selfitacademias.com.br/investidores
    candidate_endpoints: []

  bodytech:
    name: Bodytech
    monitor: bodytech
    enabled: true
    primary_url: https://www.bodytech.com.br/pt/politicas/?topico=2
    # As of 2026-09-20 this URL (static and via Playwright, two different
    # navigation/click strategies both confirmed live) only ever renders
    # generic site nav, never the "Publicacoes legais" tab's document list -
    # even though Google indexes that exact URL with the expected content
    # ("Demonstracoes Financeiras da A!BODYTECH - Exercicio de 2025"). The
    # rendered page also lists a "Documentos Gerais" tab at ?topico=4, which
    # may be where the content moved to. Needs a human with browser devtools
    # open on this page to find the real interaction/URL - see the
    # UNRESOLVED comment in monitors/bodytech.py for what was already ruled
    # out.
    #
    # Also tried and ruled out live: medias.bodytech.company/balances/, a
    # separate domain that web search shows really does host individual
    # balance-sheet PDFs (ABodytech_Balanco_2022.pdf,
    # ABodytech_Balanco_2023.pdf, ...), found by search but with no
    # index/listing page - fetching that URL directly returns an empty
    # (2xx, 0-byte) response, so there is nothing on it to scrape without
    # already knowing each year's exact filename, which is exactly the
    # "no candidate_endpoints invented" rule this project follows.
    candidate_endpoints: []
    # SPED Central de Balancos: interactive, protected search flow. Left empty
    # on purpose - the adapter skips the source with a warning rather than
    # attempting any anti-bot circumvention.
    sped_candidate_endpoints: []
    pdf_validation: true

  planet_fitness:
    name: Planet Fitness
    monitor: planet_fitness
    enabled: true
    primary_url: https://investor.planetfitness.com/news-events/press-releases
    rss_url: https://investor.planetfitness.com/rss/pressrelease.aspx

  xponential:
    name: Xponential Fitness
    monitor: xponential
    enabled: true
    primary_url: https://investor.xponential.com/financial-information/quarterly-results
    rss_url: https://investor.xponential.com/news/rss

  sports_world:
    name: Sports World
    monitor: sports_world
    enabled: true
    primary_url: https://www.sportsworld.com.mx/inversionistas/centro-de-reportes/reportes-trimestrales
    probe_enabled: true
    probe_lookahead: 2

  basic_fit:
    name: Basic-Fit
    monitor: basic_fit
    enabled: true
    primary_url: https://corporate.basic-fit.com/investors/financial-results
    press_url: https://corporate.basic-fit.com/investors/press-releases
    candidate_endpoints: []

  the_gym_group:
    name: The Gym Group
    monitor: the_gym_group
    enabled: true
    primary_url: https://www.tggplc.com/investors/results-reports-and-presentations/
    press_url: https://www.tggplc.com/investors/news/

  puregym:
    name: PureGym
    monitor: puregym
    enabled: true
    # Confirmed live path (the /investor/financial-results/quarterly-results/
    # URL in the brief now redirects here). Both are tried.
    #
    # As of 2026-09-20 this monitor gets 404 from every corporate.puregym.com
    # /investors/ URL, including primary_url below and the bare /investors/
    # root. A web search still indexes primary_url's exact title ("Pure Gym
    # Limited - Investors - Results, Reports & Presentations"), i.e. the URL
    # itself is not stale - this looks like the whole section is rejecting
    # this monitor's requests specifically (WAF/bot-detection or an IP-range
    # block), which is out of scope to try to get around. Verify by loading
    # primary_url in an ordinary browser before changing any URL here.
    #
    # A concrete, not-yet-confirmed lead found via web search: PureGym's
    # site runs on the Q4 Inc investor-relations platform (its documents
    # are served from a separate CDN domain, s28.q4cdn.com/583314398/...,
    # matching this adapter's existing PERIOD_PATH_RE pattern already) and
    # Q4's platforms typically expose the reports table through their own
    # documented API, https://<site>/feed/FinancialReport.svc/GetFinancialReportList
    # (see studioapi.q4inc.com). That would very likely be on
    # corporate.puregym.com itself, though, so it may be blocked the same
    # way - and it needs an apiKey value that is not published anywhere
    # public; only visible via the site's own devtools network tab, which
    # this session cannot open.
    primary_url: https://corporate.puregym.com/investors/results-reports-and-presentations/default.aspx
    overview_url: https://corporate.puregym.com/investors/default.aspx
    candidate_endpoints: []

  sats:
    name: SATS
    monitor: sats
    enabled: true
    primary_url: https://satsgroup.com/reports-presentations/
    news_url: https://satsgroup.com/investor-news/

  benefit_systems:
    name: Benefit Systems
    monitor: benefit_systems
    enabled: true
    primary_url: https://corp.benefitsystems.pl/en/for-investors/reports/
    # As of 2026-09-20, corp.benefitsystems.pl returns HTTP 403 to this
    # monitor's requests (confirmed live, not just locally). This is
    # domain-wide, not specific to this one path: the site's own
    # Polish-language investor section (corp.benefitsystems.pl/dla-inwestora/)
    # was also tried live and 403s identically - no same-domain path is
    # worth trying next. No attempt is made to get around it (no
    # header/User-Agent spoofing) - it may be a WAF/bot-detection block.
    #
    # Two genuinely different-domain leads, neither confirmed to actually
    # work (not wired in):
    #   - Warsaw Stock Exchange's own ESPI/EBI system,
    #     https://www.gpw.pl/espi-ebi-reports (searchable by issuer) - not
    #     confirmed to have a stable per-issuer query URL or a structured
    #     (non-HTML-scrape) endpoint.
    #   - PAP (Poland's official press agency, which distributes ESPI/EBI
    #     filings on the regulator's behalf), e.g.
    #     https://biznes.pap.pl/wiadomosci/firmy/benefit-systems-sa-raport-okresowy-roczny-skonsolidowany-srr-3
    #     - real per-report pages exist and were found by search, but no
    #     stable per-issuer listing URL/feed was found, and its own
    #     accessibility to this monitor is untested.
    # Either needs a human to confirm reachability and find a real listing
    # URL/feed before either can replace or supplement primary_url above.

  leejam:
    name: Leejam
    monitor: leejam
    enabled: true
    primary_url: https://leejam.com.sa/investor-relations/result-center-and-reports/
    ir_url: https://leejam.com.sa/investor-relations/result-center-and-reports/
    tadawul_url: https://www.saudiexchange.sa/wps/portal/saudiexchange/newsandreports/issuer-news/company-announcement?companySymbol=1830
    tadawul_candidate_endpoints: []
