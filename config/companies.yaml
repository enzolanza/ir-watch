# Lista de empresas monitoradas.
#
# v2 (nov/2026): o foco é só Bluefit, Selfit e Bodytech. As outras empresas
# continuam descritas abaixo, mas desligadas (enabled: false). Para religar
# uma delas, basta trocar para enabled: true.
#
# min_documents: quantos documentos, no mínimo, o robô espera encontrar.
# Se encontrar menos, ele trata como FALHA (o site mudou) e não como
# "nada de novo". Isso evita que o robô fique cego sem avisar.

companies:

  bluefit:
    name: Bluefit
    monitor: bluefit
    enabled: true
    primary_url: https://ri.bluefit.com.br/informacoes-financeiras/central-de-resultados/
    # Catálogo da plataforma MZ consultado pela página "Central de Resultados".
    # Alerta em TODA demonstração financeira (ITR trimestral e DFP anual):
    # a Bluefit não publica release de resultados.
    api_url: https://apicatalog.mziq.com/filemanager/company/d83ecf03-07f6-4822-8e26-922775bc0a72/filter/categories/year/meta
    category: dfs
    min_documents: 1

  selfit:
    name: Selfit
    monitor: selfit
    enabled: true
    primary_url: https://www.selfitacademias.com.br/investidores
    # Seção "Demonstrações financeiras anuais" da própria página.
    min_documents: 5

  bodytech:
    name: Bodytech
    monitor: bodytech
    enabled: true
    primary_url: https://www.bodytech.com.br/pt/politicas/?topico=2
    # Catálogo interno consultado pela página "Políticas e documentos".
    api_url: https://www.bodytech.com.br/novo-portal/api/documents/list-all
    min_documents: 5

  planet_fitness:
    name: Planet Fitness
    monitor: planet_fitness
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://investor.planetfitness.com/news-events/press-releases
    rss_url: https://investor.planetfitness.com/rss/pressrelease.aspx

  xponential:
    name: Xponential Fitness
    monitor: xponential
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://investor.xponential.com/financial-information/quarterly-results
    rss_url: https://investor.xponential.com/news/rss

  sports_world:
    name: Sports World
    monitor: sports_world
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://www.sportsworld.com.mx/inversionistas/centro-de-reportes/reportes-trimestrales
    probe_enabled: true
    probe_lookahead: 2

  basic_fit:
    name: Basic-Fit
    monitor: basic_fit
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://corporate.basic-fit.com/investors/financial-results
    press_url: https://corporate.basic-fit.com/investors/press-releases
    candidate_endpoints: []

  the_gym_group:
    name: The Gym Group
    monitor: the_gym_group
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://www.tggplc.com/investors/results-reports-and-presentations/
    press_url: https://www.tggplc.com/investors/news/

  puregym:
    name: PureGym
    monitor: puregym
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    # Confirmed live path (the /investor/financial-results/quarterly-results/
    # URL in the brief now redirects here). Both are tried.
    primary_url: https://corporate.puregym.com/investors/results-reports-and-presentations/default.aspx
    overview_url: https://corporate.puregym.com/investors/default.aspx
    candidate_endpoints: []

  sats:
    name: SATS
    monitor: sats
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://satsgroup.com/reports-presentations/
    news_url: https://satsgroup.com/investor-news/

  benefit_systems:
    name: Benefit Systems
    monitor: benefit_systems
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://corp.benefitsystems.pl/en/for-investors/reports/

  leejam:
    name: Leejam
    monitor: leejam
    enabled: false   # desligada na v2 (foco em Bluefit, Selfit e Bodytech)
    primary_url: https://leejam.com.sa/investor-relations/result-center-and-reports/
    ir_url: https://leejam.com.sa/investor-relations/result-center-and-reports/
    tadawul_url: https://www.saudiexchange.sa/wps/portal/saudiexchange/newsandreports/issuer-news/company-announcement?companySymbol=1830
    tadawul_candidate_endpoints: []
