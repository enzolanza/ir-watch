name: IR Watch (inspect validation)

# Manual-only, read-only validation against the real IR sites.
#
# Runs `ir_monitor inspect` for every configured company: fetch + classify
# only. Per src/ir_monitor/services/runner.py, `inspect()` never opens a
# database session and never builds an EmailSender - it cannot write to
# state/ir_watch.db and cannot send a real alert or open a GitHub issue,
# regardless of which branch or inputs are used.
#
# Use this to validate a collector fix (e.g. this PR's branch) against the
# live sites before merging, without touching production state.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TIMEZONE: America/Sao_Paulo
      PLAYWRIGHT_ENABLED: "true"
      LOG_LEVEL: INFO
      USER_AGENT: "ir-watch/1.0 (peer disclosure monitor; github.com/${{ github.repository }})"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser]" PyMuPDF
          python -m playwright install --with-deps chromium

      - name: Inspect every company (no writes, no alerts)
        run: |
          set +e
          STATUS=0
          for key in $(python -m ir_monitor list-companies | awk '{print $1}'); do
            echo "::group::$key"
            python -m ir_monitor inspect --company "$key" --verbose
            rc=$?
            [ "$rc" -ne 0 ] && STATUS=1
            echo "::endgroup::"
          done
          exit $STATUS
