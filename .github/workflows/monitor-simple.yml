name: IR Watch (simple)

# COMO FUNCIONA
#   - Roda sozinho a cada 30 minutos (o GitHub às vezes atrasa um pouco).
#   - O "estado" (o que já foi visto/alertado) fica em state/ir_watch.db,
#     salvo de volta neste repositório a cada execução.
#   - Alertas viram issues no GitHub; o GitHub manda e-mail sobre elas,
#     desde que você acompanhe o repositório (Watch -> All Activity).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap | check"
        required: true
        default: "check"
        type: choice
        options: [check, bootstrap]
      dry_run:
        description: "Dry run (no issues, no writes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ir-watch-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: sqlite:///state/ir_watch.db
      ALERT_PROVIDER: github_issue
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TIMEZONE: America/Sao_Paulo
      ALERT_ON_REVISION: "false"
      PLAYWRIGHT_ENABLED: "false"
      BLIND_AFTER_FAILURES: "3"
      LOG_LEVEL: INFO
      USER_AGENT: "ir-watch/2.0 (peer disclosure monitor; github.com/${{ github.repository }})"

    steps:
      - uses: actions/checkout@v4

      - name: Check that all project files are present
        run: |
          MISSING=0
          for path in pyproject.toml config/companies.yaml src/ir_monitor/cli.py; do
            if [ ! -e "$path" ]; then
              echo "::error::MISSING: $path"
              MISSING=1
            fi
          done
          [ "$MISSING" = "1" ] && exit 1
          echo "All required files are present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # O monitor sai com código de erro quando QUALQUER empresa falha.
      # Quem decide se a execução foi boa é o passo "Verdict", no final.
      - name: Run monitor
        id: run
        run: |
          mkdir -p state
          MODE="${{ github.event.inputs.mode || 'check' }}"
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          set +e
          python -m ir_monitor "$MODE" $ARGS 2>&1 | tee monitor-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Salva o estado SEM desfazer mudanças feitas no repositório enquanto
      # esta execução rodava: pega a versão mais nova do repositório e só
      # então coloca o arquivo de estado por cima.
      - name: Commit state
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ ! -f state/ir_watch.db ]; then
            echo "No state file was produced."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state/ir_watch.db "$RUNNER_TEMP/ir_watch.db"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p state
            cp "$RUNNER_TEMP/ir_watch.db" state/ir_watch.db
            git add -f state/ir_watch.db
            if git diff --cached --quiet; then
              echo "State unchanged."
              exit 0
            fi
            git commit -m "chore(state): ir-watch $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not save the state after 3 attempts."
          exit 1

      - name: Verdict
        run: |
          if ! grep -q "Companies checked:" monitor-output.txt; then
            echo "::error::The monitor crashed before it finished. Nothing was recorded."
            exit 1
          fi
          CHECKED=$(grep "Companies checked:" monitor-output.txt | grep -oE '[0-9]+')
          OK=$(grep "Successes:" monitor-output.txt | grep -oE '[0-9]+')
          echo "### IR Watch"                          >> "$GITHUB_STEP_SUMMARY"
          echo ""                                      >> "$GITHUB_STEP_SUMMARY"
          echo "- Empresas verificadas: **$CHECKED**"  >> "$GITHUB_STEP_SUMMARY"
          echo "- Funcionaram: **$OK**"                >> "$GITHUB_STEP_SUMMARY"
          grep -E "New events:|Alerts sent:" monitor-output.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          if [ "${OK:-0}" -eq 0 ]; then
            echo "::error::Todas as empresas falharam."
            exit 1
          fi
          if [ "$OK" -lt "$CHECKED" ]; then
            echo "::warning::$OK de $CHECKED empresas funcionaram. Se a falha persistir, o robô abre uma issue de aviso."
          fi
