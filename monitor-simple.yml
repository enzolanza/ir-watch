name: IR Watch (simple)

# ZERO-DEPENDENCY SETUP
#
# No database to provision, no SMTP account, no secrets to configure.
#   - State lives in state/ir_watch.db, committed back to this repo each run.
#   - Alerts are opened as GitHub issues; GitHub emails you about them,
#     provided you watch this repository (Watch -> All Activity).
#
# Use this OR monitor.yml, never both: they would fight over the same state.

on:
  schedule:
    - cron: "23 * * * *"          # hourly, off-peak minute
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap | check"
        required: true
        default: "check"
        type: choice
        options: [check, bootstrap]
      dry_run:
        description: "Dry run (no issues, no writes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ir-watch-state          # never two runs writing the state file
  cancel-in-progress: false

permissions:
  contents: write                # commit the state file back
  issues: write                  # open alert issues

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: sqlite:///state/ir_watch.db
      ALERT_PROVIDER: github_issue
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TIMEZONE: America/Sao_Paulo
      ALERT_ON_REVISION: "false"
      PLAYWRIGHT_ENABLED: "false"   # keeps each run near one minute
      LOG_LEVEL: INFO
      USER_AGENT: "ir-watch/1.0 (peer disclosure monitor; github.com/${{ github.repository }})"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . PyMuPDF

      - name: Run monitor
        id: run
        continue-on-error: true      # a failing company must not lose the state commit
        run: |
          mkdir -p state
          MODE="${{ github.event.inputs.mode || 'check' }}"
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m ir_monitor "$MODE" $ARGS

      - name: Commit state
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ ! -f state/ir_watch.db ]; then
            echo "No state file produced; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/ir_watch.db
          git diff --cached --quiet && { echo "State unchanged."; exit 0; }
          git commit -m "chore(state): ir-watch $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed in the meantime; ours is the newer state.
          git pull --rebase=false -s ours --no-edit || true
          git push

      - name: Surface monitor failures
        if: steps.run.outcome == 'failure'
        run: |
          echo "::warning::At least one company failed this run. State was still saved."
